name: oae-tmm
channels:
  - conda-forge
  - defaults
dependencies:
  - geopandas=1.0.1
  - geopandas-base=1.0.1
  - gsw=3.6.19
  - h5netcdf=1.2.0
  - matplotlib=3.10.3
  - netcdf4=1.6.5
  - numba=0.61.2
  - numpy=1.24.4
  - petsc=3.21.1
  - petsc4py=3.21.1
  - pip
  - seawater=3.3.5
  - setuptools=72.1.0
  - scipy=1.13.1
  - shapely=2.1.1
  - suitesparse=5.10.1
  - tbb=2022.2.0
  - tqdm=4.66.5
  - xarray=2025.4.0
  - pip:
      - jax==0.4.25
      - jaxlib==0.4.25
      # PyCO2SYS must be installed manually to avoid overwriting conda-managed deps:
      # pip install --no-deps git+https://github.com/mvdh7/PyCO2SYS@v2.0.0-b5
      # pyTRACE is vendored in the repo and must be installed manually:
      # pip install --no-deps pyTRACE/
      # Note: upstream has been renamed -- check https://github.com/d-sandborn/TRACE for updates
